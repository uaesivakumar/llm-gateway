name: Release

# Publishes to PyPI when a v* tag is pushed.
#
# One-time setup before this can work: on PyPI, add a Trusted Publisher for this
# repository (owner: uaesivakumar, repo: llm-gateway, workflow: release.yml,
# environment: pypi). No API token is stored anywhere -- PyPI verifies the run
# through OIDC. See https://docs.pypi.org/trusted-publishers/
#
# Until that is configured, this workflow simply fails at the publish step; the
# build and the GitHub Release still succeed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the bundled price table shipped
        run: python -m zipfile -l dist/*.whl | grep -q "llm_gateway/prices.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Skips until a PyPI project name is claimed and a Trusted Publisher is
    # configured. Set repository variable PYPI_PUBLISH=true to enable.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-gateway
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
